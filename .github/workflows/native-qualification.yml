name: GMAT Py native ARM EOF probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    if: >-
      github.repository == 'dcajacob/gmatpy' &&
      toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3f809bc0d66dfe797aa13f0d4c3236fc8d6954db
          persist-credentials: false
      - name: Prove native char default and exact reader EOF behavior
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/native-eof-probe.py" <<'PY'
          """Bounded exact-method EOF portability probe; engine sources are read-only."""
          PREFIX='#include <iostream>\n#include <sstream>\n#include <string>\n#include <vector>\n#include <limits>\n#include <cstdio>\nusing Integer=int;\nusing StringArray=std::vector<std::string>;\nusing IntegerArray=std::vector<int>;\nnamespace GmatStringUtil {enum {BOTH};std::string Trim(const std::string& s,int,bool){auto a=s.find_first_not_of(" \\t");if(a==s.npos)return "";return s.substr(a,s.find_last_not_of(" \\t")-a+1);}}\nstruct MessageInterface {static void ShowMessage(const char*,...){}};\nclass ScriptInterpreter {public:std::istream* inStream;explicit ScriptInterpreter(std::istream* p):inStream(p){}bool ReadFirstPass();bool IsBranchCommand(const std::string&){return false;}bool CheckBranchCommands(const IntegerArray&,const StringArray&){return true;}};\n'
          SUFFIX='\nint main(int argc,char**argv){std::string which=argv[1];std::string input=which=="empty"?"":which=="newline"?"Create Spacecraft Sat;\\nBeginMissionSequence;\\n":which=="crlf"?"Create Spacecraft Sat;\\r\\nBeginMissionSequence;\\r\\n":"Create Spacecraft Sat;\\nBeginMissionSequence;";std::istringstream stream(input);ScriptInterpreter parser(&stream);std::cout<<"char_signed="<<std::numeric_limits<char>::is_signed<<std::endl;bool ok=parser.ReadFirstPass();std::cout<<"READER_COMPLETED "<<ok<<std::endl;return ok?0:1;}\n'
          import argparse,hashlib,json,platform,subprocess,time
          from pathlib import Path
          p=argparse.ArgumentParser();p.add_argument('--source',type=Path,required=True);p.add_argument('--output',type=Path,required=True);p.add_argument('--expect-unsigned',action='store_true');args=p.parse_args()
          root=args.output;root.mkdir(parents=True,exist_ok=False)
          text=args.source.read_text();a=text.index('bool ScriptInterpreter::ReadFirstPass()');b=text.index(chr(10)+'}'+chr(10),a)+3;method=text[a:b]
          assert method.count('   char ch;')==1
          compiler=subprocess.check_output(['g++','--version'],text=True).splitlines()[0]
          macros=subprocess.check_output(['g++','-dM','-E','-x','c++','/dev/null'],text=True);unsigned='#define __CHAR_UNSIGNED__ 1' in macros
          if args.expect_unsigned:assert platform.machine()=='aarch64' and unsigned
          results=[]
          for version in ('original','int_type'):
           body=method if version=='original' else method.replace('   char ch;','   std::istream::int_type ch;')
           source=root/(version+'.cpp');source.write_text(PREFIX+body+SUFFIX)
           for sign in ('default','signed','unsigned'):
            exe=root/(version+'-'+sign);command=['g++','-std=c++17','-O2']+([] if sign=='default' else ['-f'+sign+'-char'])+[str(source),'-o',str(exe)];subprocess.run(command,check=True)
            for case in ('empty','newline','crlf','no-final-newline'):
             start=time.monotonic()
             try:r=subprocess.run([str(exe),case],capture_output=True,text=True,timeout=2);code=r.returncode;output=r.stdout;timed_out=False
             except subprocess.TimeoutExpired as error:code=None;output=(error.stdout or b'').decode();timed_out=True
             expected_timeout=version=='original' and (sign=='unsigned' or (sign=='default' and unsigned))
             entry={'version':version,'char_flag':sign,'case':case,'returncode':code,'timed_out':timed_out,'expected_timeout':expected_timeout,'stdout':output,'seconds':time.monotonic()-start};results.append(entry);print(json.dumps(entry),flush=True)
             assert timed_out==expected_timeout
             if not timed_out:assert code==0 and 'READER_COMPLETED 1' in output
          record={'native_machine':platform.machine(),'compiler':compiler,'default_char_unsigned':unsigned,'original_method_sha256':hashlib.sha256(method.encode()).hexdigest(),'source_sha256':hashlib.sha256(args.source.read_bytes()).hexdigest(),'support_stubs':'Trim, branch check and null-stream diagnostic only; exact ReadFirstPass body and real stringstream IO retained.','fix':'Use std::istream::int_type for peek EOF sentinel; no engine algorithm/data edited.','results':results}
          (root/'RESULTS.json').write_text(json.dumps(record,indent=2)+'\n');print('NATIVE_EOF_PROBE_OK',json.dumps(record),flush=True)
          PY
          mkdir -p "$RUNNER_TEMP/eof-output"
          docker run --rm --network none --cpus 1 --memory 2g --ulimit core=0 --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/checkout:ro" -v "$RUNNER_TEMP/eof-output:/output" \
            -v "$RUNNER_TEMP/native-eof-probe.py:/probe.py:ro" \
            quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6 \
            /opt/python/cp314-cp314/bin/python /probe.py --expect-unsigned \
            --source /checkout/src/base/interpreter/ScriptInterpreter.cpp --output /output/probe
      - name: Preserve bounded probe in ordinary logs
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'eof-output/probe'
          for path in root.glob('*.json'):
              print(path.name,hashlib.sha256(path.read_bytes()).hexdigest());print(path.read_text())
          PY
# Workflow instrumentation only; candidate engine source remains unchanged.
