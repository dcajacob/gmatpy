name: GMAT Py documentation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/**
      - python/gmatpy/**
      - pyproject.toml
      - .readthedocs.yaml
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - python/gmatpy/**
      - pyproject.toml
      - .readthedocs.yaml
      - .github/workflows/docs.yml
permissions:
  contents: read
jobs:
  html:
    # Match the existing native workflow's public standard-runner boundary.
    if: >-
      github.repository == 'dcajacob/gmatpy' &&
      toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install documentation tools only
        run: python -m pip install -r docs/requirements.txt
      - name: Check source API and build HTML with warnings as errors
        run: |
          python docs/check_api.py
          python -m sphinx -W --keep-going -n -b html docs docs/_build/html
# No native build, credentials, cache, artifact upload, or publication.
