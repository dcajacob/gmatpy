name: GMAT Py wheel tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wheel-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: Linux x86_64 / CPython 3.12
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned build and test tools
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r python/ci/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build CSPICE from the pinned NAIF source
        run: python python/ci/build_cspice.py --target linux-x86_64 --output "$RUNNER_TEMP/cspice"
      - name: Build and install the wheel from this checkout
        run: |
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/wheels" \
            -Ccmake.define.CSPICE_DIR="$RUNNER_TEMP/cspice"
          sha256sum "$RUNNER_TEMP"/wheels/*.whl
          python -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheels/*.whl
      - name: Test the installed wheel and release controls
        run: |
          python -I -c 'import gmatpy, sys; from pathlib import Path; assert Path(gmatpy.__file__).resolve().is_relative_to(sys.prefix)'
          python -I -m pytest -q -ra python/tests python/ci/test_release_controls.py .github/scripts
      - name: Check numerical references and documentation examples
        working-directory: ${{ runner.temp }}
        run: |
          python -I "$GITHUB_WORKSPACE/python/ci/sample_states.py" states.json
          python -I "$GITHUB_WORKSPACE/python/ci/check_states.py" states.json
          python -I "$GITHUB_WORKSPACE/python/ci/verify_splines.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/spline"
          python -I "$GITHUB_WORKSPACE/python/ci/verify_msise.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/msise"
          python -I "$GITHUB_WORKSPACE/docs/run_examples.py"
