name: TLE Tailor native Windows integration
on:
  push:
    branches: [codex/windows-tle-tailor-20261027]
permissions:
  contents: read
  actions: read
jobs:
  wait-for-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Keep at most two native Windows jobs active across both runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Once 3.12 and 3.13 finish, only the final 3.15 cell can remain.
          # The 3.14 wheel was already qualified before this branch was pushed.
          for attempt in $(seq 1 60); do
            finished=$(gh api repos/dcajacob/gmatpy/actions/runs/40465394325/jobs --jq '[.jobs[] | select(.name == "assess (3.12.10) / qualify" or .name == "assess (3.13.16) / qualify") | select(.status == "completed")] | length')
            if [[ "$finished" == 2 ]]; then exit 0; fi
            sleep 45
          done
          echo 'Native qualification capacity was not available in time' >&2
          exit 1
  integrate:
    needs: wait-for-capacity
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: gmatpy-ci
      - name: Check out exact verified public TLE Tailor main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dcajacob/tle-tailor
          ref: 36be851c2b8c3898cefaf32baad2b2e4e3222f03
          persist-credentials: false
          path: tle-tailor-public
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.8'
          architecture: x64
      - name: Download qualified wheel and immutable receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-3.14.8-ae25a632d778172ab9570fd5c284968c2eba08bc
          run-id: 40465394325
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gmatpy-wheel
      - name: Verify qualified artifact identity before installation
        shell: pwsh
        run: |
          $result = Get-Content "$env:RUNNER_TEMP/gmatpy-wheel/RESULTS.json" -Raw | ConvertFrom-Json
          if ($result.release_preflight -ne 'passed') { throw 'Unqualified input' }
          $wheel = Get-Item "$env:RUNNER_TEMP/gmatpy-wheel/$($result.profiles.extended.wheel)"
          if ((Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLower() -ne $result.profiles.extended.sha256) { throw 'Wheel hash mismatch' }
          if ($wheel.Length -ne $result.profiles.extended.bytes) { throw 'Wheel size mismatch' }
          if ((git -C tle-tailor-public rev-parse HEAD) -ne '36be851c2b8c3898cefaf32baad2b2e4e3222f03') { throw 'TLE Tailor source mismatch' }
      - name: Build public TLE Tailor wheel and install ordinary required dependencies
        shell: pwsh
        run: |
          python -m pip wheel --no-deps --wheel-dir "$env:RUNNER_TEMP/tle-dist" ./tle-tailor-public
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv "$env:RUNNER_TEMP/test-env"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $py = "$env:RUNNER_TEMP/test-env/Scripts/python.exe"
          $gmatWheel = (Get-ChildItem "$env:RUNNER_TEMP/gmatpy-wheel/*.whl").FullName
          $tleWheel = (Get-ChildItem "$env:RUNNER_TEMP/tle-dist/*.whl").FullName
          & $py -m pip install --only-binary=:all: $gmatWheel $tleWheel pytest==9.1.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $py -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/evidence" | Out-Null
          & $py -m pip freeze | Out-File "$env:RUNNER_TEMP/evidence/requirements-resolved.txt"
          Copy-Item "$env:RUNNER_TEMP/gmatpy-wheel/RESULTS.json" "$env:RUNNER_TEMP/evidence/gmatpy-qualification.json"
          Get-FileHash $gmatWheel,$tleWheel -Algorithm SHA256 | Format-List | Out-File "$env:RUNNER_TEMP/evidence/wheel-identities.txt"
      - name: Test installed public adapter and mandatory CPU JAX path outside source
        shell: pwsh
        run: |
          $py = "$env:RUNNER_TEMP/test-env/Scripts/python.exe"
          $checkout = $env:GITHUB_WORKSPACE
          $env:PYTHONPATH = ''
          $env:PATH = "$env:RUNNER_TEMP/test-env/Scripts;$env:SystemRoot/System32;$env:SystemRoot"
          $env:MPLCONFIGDIR = "$env:RUNNER_TEMP/matplotlib"
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/outside" | Out-Null
          Set-Location "$env:RUNNER_TEMP/outside"
          & $py -I "$checkout/gmatpy-ci/.github/scripts/windows_tle_tailor_probe.py" "$env:RUNNER_TEMP/evidence/jax-integration.json" 2>&1 | Tee-Object "$env:RUNNER_TEMP/evidence/jax-integration.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $py -m pytest -q -ra --import-mode=importlib "$checkout/tle-tailor-public/tle_tailor/tests/test_gmatpy_propagation.py" --junitxml="$env:RUNNER_TEMP/evidence/adapter-junit.xml" 2>&1 | Tee-Object "$env:RUNNER_TEMP/evidence/adapter-tests.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Run the public example with the requested JAX method explicitly.
          & $py -I -m tle_tailor.examples.scripts.gmat_integration.gmatpy_state_to_tle --method jax --duration 1800 --cadence 75 2>&1 | Tee-Object "$env:RUNNER_TEMP/evidence/jax-example.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain small integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tle-tailor-windows-integration-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/*
          retention-days: 1
          if-no-files-found: warn
