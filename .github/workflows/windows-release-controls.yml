name: Windows publication controls
on:
  pull_request:
    paths: ['.github/**', 'python/ci/**', 'python/tools/**']
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.8'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q .github/scripts/test_release_021.py .github/scripts/test_windows_release_021.py
