name: Verify exact GMAT Py 0.2.1 release files
on:
  workflow_dispatch:
    inputs:
      confirm_local_release_approval:
        description: Combined approval for exact files, staging permission and fresh $0.02 budget received
        type: boolean
        required: true
        default: false
      draft_release_id:
        description: Exact task-created unpublished staging draft containing all seventeen allowlisted files
        type: string
        required: true
permissions: {}
concurrency:
  group: gmatpy-release-0.2.1
  cancel-in-progress: false
jobs:
  stage:
    if: >-
      inputs.confirm_local_release_approval && github.event_name == 'workflow_dispatch' &&
      github.repository == 'dcajacob/gmatpy' && github.ref == 'refs/heads/main' &&
      toJSON(github.event.repository.private) == 'false' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: testpypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            python/ci
            python/tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.8'
      - name: Verify exact draft assets without building or repackaging
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python .github/scripts/release_021.py stage --release-id "$DRAFT_RELEASE_ID" --output "$RUNNER_TEMP/release-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gmatpy-0.2.1-fe8a20426a6a
          path: ${{ runner.temp }}/release-dist/*
          if-no-files-found: error
          compression-level: 0
          archive: true
          retention-days: 1
          overwrite: false
  installed:
    name: installed (${{ matrix.target }})
    needs: stage
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            python/ci
            python/tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: gmatpy-0.2.1-fe8a20426a6a
          path: ${{ runner.temp }}/release-dist
      - name: Audit all exact source, native, notice and data bytes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python .github/scripts/release_021.py verify --bundle "$RUNNER_TEMP/release-dist"
      - name: Install and test four pinned CPython release wheels; no native builds
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PYTHONDONTWRITEBYTECODE: '1'
          PIP_NO_CACHE_DIR: '1'
        run: |
          set -euo pipefail
          export SSL_CERT_FILE="$(python -c 'import pathlib,ssl; p=ssl.get_default_verify_paths().cafile; assert p and pathlib.Path(p).is_file(); print(p)')"
          for minor in 3.12 3.13 3.14 3.15; do
            interpreter_dir="$RUNNER_TEMP/interpreter-$minor"
            python python/ci/prepare_interpreter.py --minor "$minor" --target "$TARGET" --output "$interpreter_dir"
            "$interpreter_dir/python/bin/python3" python/ci/test_installed_release.py \
              --bundle "$RUNNER_TEMP/release-dist" --manifest .github/release/pypi-0.2.1.json \
              --target "$TARGET" --minor "$minor" --output "$RUNNER_TEMP/installed-$minor"
          done
# One <=1.532GB one-day artifact. Operator verifies actual service size and
# aggregate budget, preserves receipts and deletes only task-created resources.
# No native compilation, repair, cache, OIDC or PyPI upload in this workflow.
